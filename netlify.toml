[build]
command = "npm run build"
publish = "dist"

# Netlify's default `pretty_urls = true` would 301 /esport-guinee to
# /esport-guinee/ (trailing slash) now that `dist/esport-guinee/index.html`
# exists on disk. That split URL from the self-referential canonical the
# <SEO> component posts (/esport-guinee, no slash) and would re-create
# the same "autre page avec balise canonique" bucket we just closed in
# Search Console. Disabling pretty_urls keeps the no-slash URL as the
# single served canonical.
[build.processing.html]
pretty_urls = false

[build.environment]
NODE_VERSION = "20"
NODE_ENV = "production"
NPM_FLAGS = "--include=dev"
# Node heap bump for the prerender Puppeteer run (Chrome tabs x 16 routes).
NODE_OPTIONS = "--max-old-space-size=4096"
# Puppeteer v23 downloads its own Chromium at `npm install` time by
# default (into node_modules/puppeteer/.local-chromium). No env var is
# needed — explicit "false" was ambiguous and has been removed. If
# quota or runner limits bite, flip to puppeteer-core + @sparticuz/chromium
# in a follow-up (plan A).
VITE_SUPABASE_URL = "https://geozovninpeqsgtzwchu.supabase.co"
VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdlb3pvdm5pbnBlcXNndHp3Y2h1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg5MDA4NTIsImV4cCI6MjA2NDQ3Njg1Mn0.bmh2KxxuoBKqDE9ek9GdG2mFBz8htd9r8355zRssYWU"
# VITE_GOOGLE_MAPS_API_KEY → defined in Netlify dashboard env vars (secret-scoped)

[[redirects]]
from = "https://www.fegesport224.org/*"
to = "https://fegesport224.org/:splat"
status = 301
force = true

[[redirects]]
from = "http://www.fegesport224.org/*"
to = "https://fegesport224.org/:splat"
status = 301
force = true

[[redirects]]
from = "http://fegesport224.org/*"
to = "https://fegesport224.org/:splat"
status = 301
force = true

[[redirects]]
from = "/admin/Login"
to = "/admin/login"
status = 301
force = true

[[redirects]]
from = "/Admin/*"
to = "/admin/:splat"
status = 301
force = true

# Legacy demo-event URLs retired on 2026-10-07.
# Permanent redirect so Search Console can resolve the "page without interest"
# signal (crawled on 2026-04 for /events/1 and /events/3).
[[redirects]]
from = "/events/1"
to = "/events"
status = 301
force = true

[[redirects]]
from = "/events/3"
to = "/events"
status = 301
force = true

# Canonicalisation /presse → /press-kit : alias historique, meme page
# React. La 301 cote CDN evite le contenu duplique vu de Googlebot.
[[redirects]]
from = "/presse"
to = "/press-kit"
status = 301
force = true

# ============================================================
# IMPORTANT: SPA fallback — sends all non-existent paths to index.html
# Specific static files (sitemap.xml, robots.txt, *.txt, *.json, /assets/*)
# are served directly since they exist in dist/ — no rewrite needed.
# force = false means: only fallback if the file does NOT exist.
# ============================================================
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
force = false

# ============================================================
# Note: Specific SEO file headers are managed in public/_headers
# (sitemap.xml, robots.txt, /*.txt for IndexNow)
# Below: default security headers for HTML/JS/CSS.
# ============================================================
[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"
Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://geozovninpeqsgtzwchu.supabase.co https://*.supabase.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self' https://geozovninpeqsgtzwchu.supabase.co https://*.supabase.co wss://*.supabase.co; frame-src 'self' https://*.paypal.com https://www.paypal.com https://www.sandbox.paypal.com; object-src 'none'; base-uri 'self'; form-action 'self';"
Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
X-Permitted-Cross-Domain-Policies = "none"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "*.jpg"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "*.png"

[headers.values]
Cache-Control = "public, max-age=86400"

[[headers]]
for = "*.svg"

[headers.values]
Cache-Control = "public, max-age=86400"

